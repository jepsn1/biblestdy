# Production API. SPA is static (Caddy serves apps/web/build/client directly).
# Deploy: make deploy   (or: git pull && pnpm install && pnpm build web && docker compose up -d --build)
name: biblestdy

services:
  api:
    build: .
    container_name: biblestdy-api
    restart: unless-stopped
    env_file: .env            # prod env, repo root — never committed
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true
